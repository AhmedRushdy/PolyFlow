name: Bug report
description: Report a reproducible PolyFlow defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary and impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, traces, or test output
      render: text
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical — data loss or security boundary failure
        - High — core workflow unavailable
        - Medium — degraded behavior with workaround
        - Low — minor defect
    validations:
      required: true
